[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quant-v2"
version = "0.1.0"
description = "Auditable local multi-agent investment decision system"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = ["tzdata>=2025.2", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
data = ["akshare==1.18.94"]

[project.scripts]
ai-quant = "ai_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
